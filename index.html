<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>试用期员工学习管理系统</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="学习管理">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- ===== 登录页（扫码优先）===== -->
    <div id="login-view" class="view">
      <div class="login-card">
        <div class="login-logo">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="12" fill="#2563eb"/>
            <path d="M24 12L34 18V30L24 36L14 30V18L24 12Z" stroke="white" stroke-width="2.5" fill="none"/>
            <circle cx="24" cy="24" r="4" fill="white"/>
          </svg>
        </div>
        <h1 class="login-title">试用期员工学习管理系统</h1>
        <p class="login-subtitle">请使用微信扫描HR发给您的专属二维码登录</p>

        <!-- 扫码登录引导 -->
        <div style="text-align:center;padding:24px 0;">
          <div style="font-size:64px;line-height:1;margin-bottom:16px;">📱</div>
          <div style="font-size:15px;color:var(--c-text-secondary);line-height:1.6;margin-bottom:8px;">
            使用微信扫一扫功能<br>扫描您的专属登录二维码
          </div>
          <div style="font-size:13px;color:var(--c-text-muted);margin-top:12px;">
            扫码后自动登录您的账号
          </div>
        </div>

        <!-- HR 管理员入口（小字链接） -->
        <div id="hr-login-section" style="margin-top:16px;text-align:center;">
          <a href="javascript:void(0)" id="hr-login-toggle" style="font-size:12px;color:var(--c-text-muted);text-decoration:underline;">管理员登录</a>
        </div>

        <!-- HR 管理员登录表单（默认隐藏） -->
        <div id="hr-login-form" class="hidden" style="margin-top:12px;">
          <input type="text" id="hr-name-input" class="form-input" placeholder="请输入姓名" style="width:100%;margin-bottom:8px;">
          <button class="btn btn-primary" id="hr-login-btn" style="width:100%;">登录</button>
        </div>

        <p class="login-footer">顾家家居 · 人才发展中心</p>
      </div>
    </div>

    <!-- ===== 主应用 ===== -->
    <div id="main-view" class="view hidden">
      <header class="topbar">
        <div class="topbar-brand">
          <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="12" fill="#2563eb"/>
            <path d="M24 12L34 18V30L24 36L14 30V18L24 12Z" stroke="white" stroke-width="2.5" fill="none"/>
            <circle cx="24" cy="24" r="4" fill="white"/>
          </svg>
          <span>试用期学习管理系统</span>
        </div>
        <div class="topbar-right">
          <div class="topbar-user" id="topbar-user"></div>
          <button class="btn btn-ghost btn-sm" id="logout-btn">退出登录</button>
        </div>
      </header>
      <div class="layout">
        <nav class="sidebar" id="sidebar"></nav>
        <main class="content" id="content"></main>
      </div>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden"></div>
  <div id="modal-box" class="modal-box hidden"></div>
  <div id="toast-container" class="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
